---
name: Libs tests

"on":
  push:
    branches: ['develop']
  pull_request:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Setup Opentofu
        uses: opentofu/setup-opentofu@v1.0.5
        with:
          tofu_version: 1.8.5

      - name: Setup terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
          terraform_version: "1.5.5"

      - name: Download Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.4
        id: go

      - name: Check out code into the Go module directory
        uses: actions/checkout@v4

      - name: Deps
        run: |
          go get -v ./...
        working-directory: libs

      - name: Install Azurite
        run: npm install -g azurite

      - name: Start Azurite service
        run: azurite --silent &

      - name: Test
        run: |
          go test ./...
        env:
          # This fork has no DIGGER_LICENSE_KEY; skips libs/license tests.
          IS_EXTERNAL_PR: "true"
        working-directory: libs
